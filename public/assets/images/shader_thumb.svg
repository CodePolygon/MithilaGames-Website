<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="100%" stop-color="#151821" />
    </linearGradient>
    <pattern id="hatch" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#E5A93C" stroke-width="1.5" opacity="0.75"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" />
  
  <!-- Stylized Fish and Lotus Folk Hatching -->
  <circle cx="300" cy="200" r="140" fill="url(#hatch)" stroke="#E5A93C" stroke-width="3"/>
  <circle cx="300" cy="200" r="100" fill="#08090C" stroke="#D45B38" stroke-width="2"/>
  <circle cx="300" cy="200" r="60" fill="url(#hatch)" stroke="#E5A93C" stroke-width="2"/>
  <circle cx="300" cy="200" r="20" fill="#E5A93C"/>

  <rect x="20" y="20" width="190" height="30" fill="#0F1117" stroke="#232735" stroke-width="1"/>
  <text x="30" y="40" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E5A93C" font-weight="bold">MADHUBANI SHADER</text>
  <text x="560" y="380" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B5B9C5" text-anchor="end">GLSL CC0 // VULKAN COMPUTE</text>
</svg>
