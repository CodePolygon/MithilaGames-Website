<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B1704" />
      <stop offset="100%" stop-color="#0A0C10" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFB800" stroke-width="0.8" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bg)" />
  <rect width="800" height="480" fill="url(#glow)" />
  <rect width="800" height="480" fill="url(#grid)" />
  
  <!-- Outer Tech Border Frame -->
  <rect x="16" y="16" width="768" height="448" rx="12" fill="none" stroke="#FFB800" stroke-width="2" opacity="0.4"/>
  <rect x="24" y="24" width="752" height="432" rx="8" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>

  <!-- Top Pill Badge -->
  <rect x="36" y="36" width="240" height="38" rx="8" fill="#08090C" stroke="#FFB800" stroke-width="2" />
  <circle cx="54" cy="55" r="5" fill="#FFB800" />
  <text x="68" y="60" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" font-weight="800" fill="#FFB800" letter-spacing="1.5">SECURITY // ANTI-CHEAT</text>

  <!-- Top Right Studio Watermark -->
  <text x="750" y="60" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="800" fill="#94A3B8" text-anchor="end" letter-spacing="1.5">MITHILA GAMES // LABS</text>

  <!-- Center Giant Visual Symbol -->
  <g transform="translate(400, 200)">
    
  <path d="M 0 -110 L 90 -60 L 90 30 Q 90 105 0 135 Q -90 105 -90 30 L -90 -60 Z" fill="#0D1117" stroke="#FFB800" stroke-width="6"/>
  <path d="M 0 -90 L 70 -50 L 70 20 Q 70 85 0 110 Q -70 85 -70 20 L -70 -50 Z" fill="none" stroke="#FF0055" stroke-width="3" opacity="0.8"/>
  <circle cx="0" cy="15" r="35" fill="#FFB800" opacity="0.2"/>
  <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">RING-0</text>

  </g>

  <!-- Giant Punchy Title (Visible at ANY size!) -->
  <text x="400" y="385" font-family="'Syne', system-ui, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">RING-0 KERNEL DEFENSE</text>
  <text x="400" y="422" font-family="'JetBrains Mono', monospace, sans-serif" font-size="15" font-weight="800" fill="#FFB800" text-anchor="middle" letter-spacing="2">DRIVERS VS SERVER-SIDE ML</text>
</svg>