<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_help_b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042614" />
      <stop offset="50%" stop-color="#02140A" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <radialGradient id="glow_help_b" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_help_b" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00FF88" stroke-width="0.8" opacity="0.14"/>
    </pattern>
    <filter id="shadow_help_b" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base with Glow and Tech Grid -->
  <rect width="800" height="480" fill="url(#bg_help_b)" />
  <rect width="800" height="480" fill="url(#glow_help_b)" />
  <rect width="800" height="480" fill="url(#grid_help_b)" />

  <!-- Outer Cyber Frame -->
  <rect x="18" y="18" width="764" height="444" rx="14" fill="none" stroke="#00FF88" stroke-width="2.5" opacity="0.45"/>
  <rect x="26" y="26" width="748" height="428" rx="10" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.08"/>

  <!-- Tactical Reticle Corners -->
  <path d="M 18 56 L 18 18 L 56 18" fill="none" stroke="#00FF88" stroke-width="4"/>
  <path d="M 782 56 L 782 18 L 744 18" fill="none" stroke="#00FF88" stroke-width="4"/>
  <path d="M 18 424 L 18 462 L 56 462" fill="none" stroke="#00FF88" stroke-width="4"/>
  <path d="M 782 424 L 782 462 L 744 462" fill="none" stroke="#00FF88" stroke-width="4"/>

  <!-- Top Pill Badge (Large & Legible) -->
  <rect x="38" y="34" width="250" height="40" rx="8" fill="#08090C" stroke="#00FF88" stroke-width="2" />
  <circle cx="58" cy="54" r="5" fill="#00FF88" />
  <text x="74" y="60" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="900" fill="#00FF88" letter-spacing="1.5">MOST SEARCHED [Blender]</text>

  <!-- Top Right Watermark -->
  <text x="744" y="60" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="end" letter-spacing="2">MITHILA GAMES // INTEL</text>

  <!-- Center Giant Visual Symbol / Icon -->
  <g transform="translate(400, 205)" filter="url(#shadow_help_b)">
    
            <!-- 3D Gizmo -->
            <line x1="0" y1="0" x2="110" y2="0" stroke="#FF0055" stroke-width="6"/>
            <text x="130" y="7" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#FF0055">X</text>
            <line x1="0" y1="0" x2="0" y2="-110" stroke="#00FF88" stroke-width="6"/>
            <text x="0" y="-125" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#00FF88" text-anchor="middle">Z (Up)</text>
            <line x1="0" y1="0" x2="-80" y2="70" stroke="#00F0FF" stroke-width="6"/>
            <text x="-100" y="90" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#00F0FF">Y</text>
            <rect x="35" y="-70" width="120" height="36" rx="8" fill="#00FF88"/>
            <text x="95" y="-46" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="900" fill="#08090C" text-anchor="middle">SCALE: 1.0</text>
        
  </g>

  <!-- Bottom Hero Title Bar (Large, High-Contrast & 100% Legible at ANY Size) -->
  <rect x="38" y="360" width="724" height="82" rx="10" fill="#08090C" stroke="#00FF88" stroke-width="2" opacity="0.96"/>
  <text x="58" y="405" font-family="'Syne', 'Impact', system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.3">FIX BLENDER TO ENGINE 100X SCALE BUG</text>
  <text x="58" y="428" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="800" fill="#00FF88" letter-spacing="1.5">TRANSFORM APPLICATION (CTRL+A) // GLTF 2.0 EXPORT</text>
  
  <!-- Right Action Pill -->
  <circle cx="720" cy="401" r="18" fill="#151821" stroke="#00FF88" stroke-width="2"/>
  <text x="720" y="407" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#00FF88" text-anchor="middle">→</text>
</svg>