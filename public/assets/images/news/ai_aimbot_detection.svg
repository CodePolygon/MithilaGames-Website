<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ai_aim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032614" />
      <stop offset="50%" stop-color="#02140A" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <radialGradient id="glow_ai_aim" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_ai_aim" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00FF88" stroke-width="0.8" opacity="0.14"/>
    </pattern>
    <filter id="shadow_ai_aim" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base with Glow and Tech Grid -->
  <rect width="800" height="480" fill="url(#bg_ai_aim)" />
  <rect width="800" height="480" fill="url(#glow_ai_aim)" />
  <rect width="800" height="480" fill="url(#grid_ai_aim)" />

  <!-- Outer Cyber Frame -->
  <rect x="18" y="18" width="764" height="444" rx="14" fill="none" stroke="#00FF88" stroke-width="2.5" opacity="0.45"/>
  <rect x="26" y="26" width="748" height="428" rx="10" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.08"/>

  <!-- Tactical Reticle Corners -->
  <path d="M 18 56 L 18 18 L 56 18" fill="none" stroke="#00FF88" stroke-width="4"/>
  <path d="M 782 56 L 782 18 L 744 18" fill="none" stroke="#00FF88" stroke-width="4"/>
  <path d="M 18 424 L 18 462 L 56 462" fill="none" stroke="#00FF88" stroke-width="4"/>
  <path d="M 782 424 L 782 462 L 744 462" fill="none" stroke="#00FF88" stroke-width="4"/>

  <!-- Top Pill Badge (Large & Legible) -->
  <rect x="38" y="34" width="250" height="40" rx="8" fill="#08090C" stroke="#00FF88" stroke-width="2" />
  <circle cx="58" cy="54" r="5" fill="#00FF88" />
  <text x="74" y="60" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="900" fill="#00FF88" letter-spacing="1.5">AI &amp; ANTI-CHEAT</text>

  <!-- Top Right Watermark -->
  <text x="744" y="60" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="end" letter-spacing="2">MITHILA GAMES // INTEL</text>

  <!-- Center Giant Visual Symbol / Icon -->
  <g transform="translate(400, 205)" filter="url(#shadow_ai_aim)">
    
            <circle cx="0" cy="0" r="95" fill="none" stroke="#00FF88" stroke-width="4" stroke-dasharray="14, 8"/>
            <line x1="-130" y1="0" x2="-60" y2="0" stroke="#00FF88" stroke-width="5"/>
            <line x1="60" y1="0" x2="130" y2="0" stroke="#00FF88" stroke-width="5"/>
            <line x1="0" y1="-130" x2="0" y2="-60" stroke="#00FF88" stroke-width="5"/>
            <line x1="0" y1="60" x2="0" y2="130" stroke="#00FF88" stroke-width="5"/>
            <circle cx="0" cy="0" r="10" fill="#FF0055"/>
            <text x="0" y="-35" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#00FF88" text-anchor="middle">YOLO CV DETECT: 99.4%</text>
        
  </g>

  <!-- Bottom Hero Title Bar (Large, High-Contrast & 100% Legible at ANY Size) -->
  <rect x="38" y="360" width="724" height="82" rx="10" fill="#08090C" stroke="#00FF88" stroke-width="2" opacity="0.96"/>
  <text x="58" y="405" font-family="'Syne', 'Impact', system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.3">AI AIMBOTS VS NEURAL CV DETECTION</text>
  <text x="58" y="428" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="800" fill="#00FF88" letter-spacing="1.5">YOLO VISUAL DETECTORS // INHUMAN ACCELERATION</text>
  
  <!-- Right Action Pill -->
  <circle cx="720" cy="401" r="18" fill="#151821" stroke="#00FF88" stroke-width="2"/>
  <text x="720" y="407" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#00FF88" text-anchor="middle">→</text>
</svg>