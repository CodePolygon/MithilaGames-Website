<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_normal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131340" />
      <stop offset="50%" stop-color="#090924" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <radialGradient id="glow_normal" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#8080FF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#8080FF" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_normal" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#8080FF" stroke-width="0.8" opacity="0.14"/>
    </pattern>
    <filter id="shadow_normal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base with Glow and Tech Grid -->
  <rect width="800" height="480" fill="url(#bg_normal)" />
  <rect width="800" height="480" fill="url(#glow_normal)" />
  <rect width="800" height="480" fill="url(#grid_normal)" />

  <!-- Outer Cyber Frame -->
  <rect x="18" y="18" width="764" height="444" rx="14" fill="none" stroke="#8080FF" stroke-width="2.5" opacity="0.45"/>
  <rect x="26" y="26" width="748" height="428" rx="10" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.08"/>

  <!-- Tactical Reticle Corners -->
  <path d="M 18 56 L 18 18 L 56 18" fill="none" stroke="#8080FF" stroke-width="4"/>
  <path d="M 782 56 L 782 18 L 744 18" fill="none" stroke="#8080FF" stroke-width="4"/>
  <path d="M 18 424 L 18 462 L 56 462" fill="none" stroke="#8080FF" stroke-width="4"/>
  <path d="M 782 424 L 782 462 L 744 462" fill="none" stroke="#8080FF" stroke-width="4"/>

  <!-- Top Pill Badge (Large & Legible) -->
  <rect x="38" y="34" width="250" height="40" rx="8" fill="#08090C" stroke="#8080FF" stroke-width="2" />
  <circle cx="58" cy="54" r="5" fill="#8080FF" />
  <text x="74" y="60" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="900" fill="#8080FF" letter-spacing="1.5">TEXTURE PIPELINE</text>

  <!-- Top Right Watermark -->
  <text x="744" y="60" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="end" letter-spacing="2">MITHILA GAMES // INTEL</text>

  <!-- Center Giant Visual Symbol / Icon -->
  <g transform="translate(400, 205)" filter="url(#shadow_normal)">
    
            <rect x="-95" y="-95" width="190" height="190" rx="14" fill="#8080FF" stroke="#FFFFFF" stroke-width="3"/>
            <circle cx="0" cy="0" r="55" fill="#9999FF" stroke="#6666FF" stroke-width="4"/>
            <text x="0" y="8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">MikkTSpace</text>
        
  </g>

  <!-- Bottom Hero Title Bar (Large, High-Contrast & 100% Legible at ANY Size) -->
  <rect x="38" y="360" width="724" height="82" rx="10" fill="#08090C" stroke="#8080FF" stroke-width="2" opacity="0.96"/>
  <text x="58" y="405" font-family="'Syne', 'Impact', system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.3">BAKING 4K MIKKTSPACE NORMAL MAPS</text>
  <text x="58" y="428" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="800" fill="#8080FF" letter-spacing="1.5">CAGE EXPANSION // SEAM FIXES &amp; GREEN CHANNEL ALIGN</text>
  
  <!-- Right Action Pill -->
  <circle cx="720" cy="401" r="18" fill="#151821" stroke="#8080FF" stroke-width="2"/>
  <text x="720" y="407" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#8080FF" text-anchor="middle">→</text>
</svg>